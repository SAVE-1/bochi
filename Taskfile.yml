  #     - ./bin/{{.EXENAME}} help

  # test-all:
  #   cmds:
  #     - go test -tags=all ./...
  
  # test-integration:
  #   cmds:
  #     - go test --tags=integration ./...


# UTILITY
  loc:
    cmds:
      - cloc . --exclude-dir=.git,temp



